var view='list', tab=0, curId=null, flow=false, subtab='answer', curTask=0;

/* работа = одно или несколько заданий; одиночная сдача приводится к тому же виду */
function tasksOf(s){
  return s.tasks || [{q:s.task, kind:s.kind, answer:s.answer, files:s.files, ref:s.ref,
                      tests:s.tests, max:s.max, criteria:s.criteria}];
}
function multi(s){ return tasksOf(s).length > 1; }
function tSum(s){
  var v = 0; (s.tScores || []).forEach(function(x){ if(x != null) v += x; }); return v;
}
function tDone(s){
  var n = 0; tasksOf(s).forEach(function(_, i){ if(s.tScores && s.tScores[i] != null) n++; }); return n;
}

function tabState(t){ return t===0 ? ['new','late'] : (t===1 ? ['confirm'] : ['done','rework']); }
function listFor(t){ var st = tabState(t); return SUBS.filter(function(s){ return st.indexOf(s.state) >= 0; }); }
function esc(s){ return s.replace(/</g, '&lt;'); }
function findCur(){ for(var i=0;i<SUBS.length;i++) if(SUBS[i].id === curId) return SUBS[i]; }

function render(){ view === 'list' ? renderList() : renderCard(); }

      '<th class="hide-sm">Сдано</th><th>Статус</th></tr></thead><tbody>' +
      items.map(function(s){
        var cls = s.label==='КР' ? 'kr' : (s.label==='ДЗ' ? 'dz' : 'sr');
        var st = s.state==='new' ? '<span class="st st-new">На проверке</span>'
          : s.state==='late' ? '<span class="st st-late">Просрочено</span>'
          : s.state==='confirm' ? '<span class="st st-conf">Ждёт подтверждения</span>'
          : s.state==='rework' ? '<span class="st st-rew">На доработку</span>'
          : '<span class="st st-ok">Зачтено · '+s.score+'/'+s.max+'</span>';
        var ini = s.name.split(' ').map(function(w){ return w[0]; }).join('');
        return '<tr class="row" onclick="openSub('+s.id+')">' +
          '<td><div class="who"><span class="av">'+ini+'</span><div><div>'+s.name+'</div>' +
          (s.iter>1 ? '<div class="muted">итерация '+s.iter+'</div>' : '') + '</div></div></td>' +
          '<td><span class="lb '+cls+'">'+s.label+'</span> '+s.work+'</td>' +
          '<td class="hide-sm muted">'+s.group+'</td><td class="hide-sm muted">'+s.at+'</td><td>'+st+'</td></tr>';
      }).join('') + '</tbody></table>';
  }
  document.getElementById('app').innerHTML =
    '<header class="head"><h1>Проверка работ</h1>' +
      '<span class="muted">'+listFor(0).length+' ждут проверки · '+listFor(1).length+' ждут подтверждения</span>' +
      '<div class="sp"></div><button class="btn btn-p" onclick="startFlow()">Проверять подряд</button></header>' +
    '<div class="tabs">' +
      '<button class="'+(tab===0?'on':'')+'" onclick="setTab(0)">На проверке<span class="b">'+listFor(0).length+'</span></button>' +
      '<button class="'+(tab===1?'on':'')+'" onclick="setTab(1)">Ждут подтверждения<span class="b">'+listFor(1).length+'</span></button>' +
      '<button class="'+(tab===2?'on':'')+'" onclick="setTab(2)">Проверенные<span class="b">'+listFor(2).length+'</span></button>' +
    '</div>' +
    '<div class="filters">' +
      '<select><option>Все мои группы</option><option>МЕГЭ-1</option><option>ИНФ-2</option></select>' +
      '<select><option>Все типы работ</option><option>ДЗ</option><option>СР</option><option>КР</option></select>' +
      '<select><option>Сначала старые</option><option>Сначала новые</option></select>' +
      '<span class="sp"></span><span class="muted hide-sm">Экран приносит модуль ручной проверки</span>' +
    '</div><div class="wrap">' + rows + '</div>';
}

function answerBlock(t){
  var inner;
  if(t.kind==='text') inner = '<p>'+t.answer+'</p>';
  else if(t.kind==='code') inner = '<pre>'+esc(t.answer)+'</pre>';
  else inner = t.files.map(function(f){
    return '<div class="file"><span class="ext">'+f[0].split('.').pop().toUpperCase()+'</span>' +
      '<div style="flex:1"><div>'+f[0]+'</div><div class="muted">'+f[1]+'</div></div>' +
      '<button class="btn btn-s">Открыть</button></div>'; }).join('');
  return '<div class="card"><h4>Ответ ученика<span class="sp"></span>' +
    (t.tests ? '<span class="muted" style="text-transform:none;letter-spacing:0">'+t.tests+'</span>' : '') +
    '</h4>'+inner+'</div>';
}
function refInner(t){
  return t.kind==='code' ? '<pre>'+esc(t.ref)+'</pre>' : '<p style="white-space:pre-line;margin:0">'+t.ref+'</p>';
}
function taskBlock(t, i, n){
  return '<div class="card"><h4>Задание' + (n > 1 ? ' '+(i+1)+' из '+n+' <span class="sp"></span>' +
      '<span class="muted" style="text-transform:none;letter-spacing:0">максимум '+t.max+'</span>' : '') +
    '</h4><p style="margin:0">'+t.q+'</p></div>';
}

/* панель заданий работы — проверка идёт по всей работе, задание за заданием */
function taskPanel(s){
  var ts = tasksOf(s);
  if(ts.length < 2) return '';
  return '<div class="tasks"><span class="ttl">Задания работы</span><div class="nums">' +
    ts.map(function(t, i){
      var d = s.tScores && s.tScores[i] != null;
      return '<button class="tn '+(d?'done ':'')+(i===curTask?'on':'')+'" onclick="goTask('+i+')" ' +
        'title="Задание '+(i+1)+' · максимум '+t.max+' · '+(d ? 'оценено: '+s.tScores[i] : 'не оценено')+'">'+(i+1)+'</button>';
    }).join('') + '</div>' +
    '<span class="pr" id="tPr">Оценено <b>'+tDone(s)+' из '+ts.length+'</b> · <b>'+tSum(s)+'</b> из '+s.max+'</span>' +
    '<button class="btn btn-s" onclick="nextUngraded()">К неоценённому</button></div>';
}
function histBlock(s){
  if(!s.history || !s.history.length) return '';
  return '<div class="card hist"><h4>История сдач</h4>' + s.history.map(function(h){
    return '<div class="it"><b>'+h.v+'</b> <span class="when">· '+h.when+'</span><div class="muted">'+h.txt+'</div></div>';
  }).join('') + '</div>';
}
function layoutBody(s){
  var ts = tasksOf(s), t = ts[curTask] || ts[0];
  return taskPanel(s) + taskBlock(t, curTask, ts.length) +
    '<div class="subtabs">' +
      '<button class="'+(subtab==='answer'?'on':'')+'" onclick="setSubtab(\'answer\')">Ответ ученика</button>' +
      '<button class="'+(subtab==='ref'?'on':'')+'" onclick="setSubtab(\'ref\')">Эталон</button></div>' +
    (subtab==='answer' ? answerBlock(t) : '<div class="card"><h4>Эталон и ожидаемое решение</h4>'+refInner(t)+'</div>') +
    histBlock(s);
}
function gradeBlock(s, values){
  var ts = tasksOf(s), t = ts[curTask] || ts[0], m = multi(s);
  var crits = t.criteria || [{n:'Выполнение', h:'', max:t.max}];
  var v = values || (m && s.tCrit && s.tCrit[curTask]) || crits.map(function(){ return ''; });
  var label = m ? 'Задание '+(curTask+1)+' — '+(crits.length>1 ? 'критерии' : 'оценка')
                : (crits.length>1 ? 'Критерии оценивания' : 'Оценка');
  return '<div class="fld" style="margin:0"><label>'+label+'</label><div class="crit">' +
    crits.map(function(c,i){
      return '<div><span class="nm'+(c.h?' has-hint':'')+'"'+(c.h?' title="'+c.h+'"':'')+'>'+c.n+'</span></div>' +
        '<div class="in"><input type="number" class="cr" min="0" max="'+c.max+'" value="'+(v[i]!=null?v[i]:'')+'" oninput="recalc()">' +
        '<span class="mx">из '+c.max+'</span></div>';
    }).join('') +
    '</div><div class="crit-total"><span>'+(m ? 'За задание' : 'Итого')+'</span>' +
    '<span><b id="critSum">0</b> из '+t.max+'</span></div></div>';
}
function recalc(){
  var ins = [].slice.call(document.querySelectorAll('.cr'));
  var sum = ins.reduce(function(a,i){ return a + (+i.value||0); }, 0);
  var el = document.getElementById('critSum');
  if(el) el.textContent = sum;
  /* живой пересчёт итога работы в панели заданий */
  var s = findCur(), pr = document.getElementById('tPr');
  if(s && pr && multi(s)){
    var total = 0, done = 0, filled = ins.some(function(i){ return i.value !== ''; });
    tasksOf(s).forEach(function(_, i){
      var v = i === curTask ? (filled ? sum : null) : (s.tScores ? s.tScores[i] : null);
      if(v != null){ total += v; done++; }
    });
    pr.innerHTML = 'Оценено <b>'+done+' из '+tasksOf(s).length+'</b> · <b>'+total+'</b> из '+s.max;
  }
}

/* сохранение оценки текущего задания при переходе */
function saveTask(){
  var s = findCur();
  if(!s || !multi(s)) return;
  var ins = [].slice.call(document.querySelectorAll('.cr'));
  if(!ins.length) return;
  var vals = ins.map(function(i){ return i.value; });
  s.tCrit = s.tCrit || []; s.tScores = s.tScores || [];
  s.tCrit[curTask] = vals;
  s.tScores[curTask] = vals.some(function(v){ return v !== ''; })
    ? vals.reduce(function(a,v){ return a + (+v||0); }, 0) : null;
  var c = document.getElementById('gCmt');
  if(c) s.comment = c.value;
}
function goTask(i){ saveTask(); curTask = i; render(); }
function nextUngraded(){
  saveTask();
  var s = findCur(), ts = tasksOf(s);
  for(var k=1; k<=ts.length; k++){
    var i = (curTask + k) % ts.length;
    if(!s.tScores || s.tScores[i] == null){ curTask = i; render(); return; }
  }
  render();
  toast('Все задания оценены — работу можно зачесть');
}
function currentScore(){
  var ins = [].slice.call(document.querySelectorAll('.cr'));
  if(!ins.length) return null;
  if(ins.every(function(i){ return i.value === ''; })) return null;
  return ins.reduce(function(a,i){ return a + (+i.value||0); }, 0);
}

function renderCard(){
  var s = findCur(), items = listFor(tab), idx = -1;
  for(var i=0;i<items.length;i++) if(items[i].id === curId) idx = i;
  var conf = s.state === 'confirm', done = s.state === 'done';
  var verdict;
  if(done){
    verdict = '<div class="v-actions" style="justify-content:space-between">' +
      '<span class="muted">Проверено: '+s.score+' из '+s.max+'. Изменение результата журналируется.</span>' +
      '<button class="btn" onclick="toast(\'Результат открыт для изменения\')">Изменить результат</button></div>';
  } else {
    var m = multi(s), ts = tasksOf(s);
    verdict = '<div class="v-top">' + gradeBlock(s, conf ? s.critValues : null) +
      '<div class="fld" style="margin:0"><label>Комментарий' + (m ? ' к работе' : '') +
      (conf ? '' : ' — обязателен при отправке на доработку') + '</label>' +
      '<textarea class="cmt" id="gCmt" placeholder="Что зачтено, что исправить…">' + (s.comment||'') + '</textarea>' +
      '<div class="err-msg" id="gErr">Напишите, что исправить — без комментария на доработку не отправить</div></div></div>' +
      '<div class="warn-note" id="wNote">Оценены не все задания работы — зачесть можно только целиком.</div>' +
      '<div class="v-actions">' + (conf
        ? '<button class="btn btn-ok" onclick="confirmVerdict()">Подтвердить вердикт</button>'
        : m
          ? '<button class="btn" onclick="verdictAct(0)">Всю работу на доработку</button>' +
            '<button class="btn" onclick="nextUngraded()">Сохранить и далее ›</button>' +
            '<button class="btn btn-ok" onclick="finishWork()">Зачесть работу</button>'
          : '<button class="btn" onclick="verdictAct(0)">На доработку</button>' +
            '<button class="btn btn-ok" onclick="verdictAct(1)">Зачтено</button>') + '</div>';
  }

  document.getElementById('app').innerHTML =
    '<header class="head">' +
      '<button class="btn btn-s" onclick="backToList()">‹ К очереди</button>' +
      '<div><h1>'+s.name+'</h1><div class="muted">'+s.group+' · '+s.work+' · сдано '+s.at+'</div></div>' +
      '<div class="sp"></div>' +
      '<span class="muted">'+(idx+1)+' из '+items.length+'</span>' +
      '<button class="btn btn-s" onclick="prevNext(-1)">‹</button>' +
      '<button class="btn btn-s" onclick="prevNext(1)">›</button>' +
    '</header>' +
    '<div class="page"><div class="pg">' +
      (conf ? '<div class="conf-note"><b>Проверил '+s.reviewer+'</b> — предложено <b>'+s.proposed+' из '+s.max+'</b>. ' +
        'Настройка «подтверждение результата проверяющего преподавателем» включена: вердикт вступит в силу после вашего подтверждения.</div>' : '') +
      '<div class="meta"><span>Попытка <b>'+s.iter+'</b></span><span>Максимум <b>'+s.max+'</b></span>' +
      '<span>Тип <b>'+s.label+'</b></span>' +
      (s.lesson ? '<span>Урок <b>'+s.lesson+'</b></span>' : '') +
      (multi(s) ? '<span>Заданий <b>'+tasksOf(s).length+'</b></span>' : '') +
      (flow ? '<span>Режим <b>«подряд»</b></span>' : '') + '</div>' +
      layoutBody(s) + '<div class="verdict">'+verdict+'</div>' +
    '</div></div>';
  recalc();
}

function openSub(id){ curId = id; view = 'page'; subtab = 'answer'; curTask = 0; render(); }
function backToList(){ view = 'list'; flow = false; curId = null; render(); }
function setSubtab(t){ subtab = t; render(); }
function setTab(t){ tab = t; view = 'list'; curId = null; render(); }
function prevNext(d){
  saveTask();
  var items = listFor(tab), i = -1;
  for(var k=0;k<items.length;k++) if(items[k].id === curId) i = k;
  var j = Math.max(0, Math.min(items.length-1, i+d));
  if(items[j]){ curId = items[j].id; curTask = 0; render(); }
}
/* зачесть работу целиком: только когда оценены все её задания */
function finishWork(){
  saveTask();
  var s = findCur(), ts = tasksOf(s), miss = [];
  ts.forEach(function(_, i){ if(!s.tScores || s.tScores[i] == null) miss.push(i+1); });
  if(miss.length){
    document.getElementById('wNote').classList.add('on');
    document.getElementById('wNote').textContent =
      'Не оценены задания: ' + miss.join(', ') + '. Работа зачитывается целиком — оцените все.';
    toast('Осталось оценить ' + miss.length + ' задани' + (miss.length === 1 ? 'е' : 'я'));
    curTask = miss[0] - 1; render();
    document.getElementById('wNote').classList.add('on');
    return;
  }
  s.state = 'done'; s.score = tSum(s);
  toast('Зачтено: '+s.name+' · '+s.score+' из '+s.max+' по '+ts.length+' заданиям. Балл появится в журнале и у ученика');
  afterVerdict();
}
function verdictAct(ok){
  var s = findCur();
  var cmt = document.getElementById('gCmt').value.replace(/^\s+|\s+$/g, '');
  var score = multi(s) ? tSum(s) : currentScore();
  if(!ok && !cmt){
    document.getElementById('gCmt').classList.add('err');
    document.getElementById('gErr').classList.add('on');
    return;
  }
  if(ok){ s.state='done'; s.score = score==null ? s.max : score; s.comment = cmt;
    toast('Зачтено: '+s.name+' · '+s.score+' из '+s.max+'. Балл появится в журнале и у ученика'); }
  else { s.state='rework'; s.comment = cmt;
    toast('На доработку: '+s.name+'. Ученик получит уведомление и сможет сдать снова'); }
  afterVerdict();
}
function confirmVerdict(){
  var s = findCur(), sc = currentScore();
  s.state='done'; s.score = sc==null ? s.proposed : sc; s.comment = document.getElementById('gCmt').value;
  toast('Вердикт подтверждён: '+s.name+' · '+s.score+' из '+s.max+'. Проверяющий уведомлён');
  afterVerdict();
}
function afterVerdict(){
  var items = listFor(tab);
  if(flow && items.length){ curId = items[0].id; render(); }
  else backToList();
}
function startFlow(){
  var items = listFor(tab);
  if(!items.length){ toast('Очередь пуста'); return; }
  flow = true; openSub(items[0].id);
  toast('Режим «подряд»: после вердикта сразу откроется следующая работа');
}
var tt;
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 3800); }

/* адрес карточки: 05-review.html#sub=7 или #stu=Абрамов%20Кирилл — со страницы работы
   и из журнала открывается сразу нужная сдача, а не общая очередь */
function applyHash(){
  var m = location.hash.match(/(?:^|[#&])sub=(\d+)/);
  var s = m ? SUBS.filter(function(x){ return x.id === +m[1]; })[0] : null;
  if(!s){
    var n = location.hash.match(/(?:^|[#&])stu=([^&]+)/);
    if(n){
      var name = decodeURIComponent(n[1]);
      s = SUBS.filter(function(x){ return x.name === name && ['new','late'].indexOf(x.state) >= 0; })[0]
        || SUBS.filter(function(x){ return x.name === name; })[0];
      if(!s) toast('Сдача ученика «'+name+'» не найдена — открыта общая очередь');
    }
  }
  if(s){ tab = ['new','late'].indexOf(s.state) >= 0 ? 0 : (s.state === 'confirm' ? 1 : 2); openSub(s.id); return true; }
  return false;
}
addEventListener('hashchange', applyHash);
if(!applyHash()) render();
</script>
</body>
</html>
